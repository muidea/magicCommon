name: Release Build Pipeline

on:
  push:
    tags:
      - "v*" # 只在打标签时触发发布构建

jobs:
  release:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: testdb
          MYSQL_ROOT_PASSWORD: rootkit
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      postgres:
        image: docker.io/postgres:17.2-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rootkit
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.7"

      - name: Run build and lint
        run: |
          make build
          make lint

      - name: Run Go tests
        run: |
          run_test() {
            local output
            output="$(mktemp)"
            if "$@" >"$output" 2>&1; then
              rm -f "$output"
              return 0
            fi
            cat "$output"
            rm -f "$output"
            return 1
          }
          run_test go test ./... --count=1

      - name: Run MySQL tests
        run: |
          run_test() {
            local output
            output="$(mktemp)"
            if "$@" >"$output" 2>&1; then
              rm -f "$output"
              return 0
            fi
            cat "$output"
            rm -f "$output"
            return 1
          }
          run_test go test -tags=mysql -count 1 ./...

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"
